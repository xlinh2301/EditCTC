<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
<defs><style>.title{font:700 30px sans-serif;fill:#172033}.h{font:700 21px sans-serif;fill:#172033}.t{font:16px sans-serif;fill:#24344c}.s{font:14px sans-serif;fill:#4b5c74}.box{stroke-width:2;rx:14}.a{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#64748b"/></marker></defs>
<rect width="1500" height="900" fill="#fbfcfe"/><text x="55" y="58" class="title">Inside the shortlisted backbone blocks</text>
<!-- LCNet -->
<rect x="50" y="105" width="680" height="320" fill="#eaf4ff" stroke="#2878c8" class="box"/><text x="80" y="145" class="h">PPLCNetV4 / LCNetV4 recognition block</text>
<rect x="90" y="185" width="155" height="70" fill="#fff" stroke="#7aa8d6" class="box"/><text x="167" y="215" text-anchor="middle" class="t">DW / RepDW</text><text x="167" y="239" text-anchor="middle" class="s">local spatial mix</text>
<rect x="300" y="185" width="150" height="70" fill="#fff" stroke="#7aa8d6" class="box"/><text x="375" y="215" text-anchor="middle" class="t">1×1 expand</text><text x="375" y="239" text-anchor="middle" class="s">×2 channels</text>
<rect x="505" y="185" width="150" height="70" fill="#fff" stroke="#7aa8d6" class="box"/><text x="580" y="215" text-anchor="middle" class="t">GELU → project</text><text x="580" y="239" text-anchor="middle" class="s">residual if shape same</text>
<path d="M245 220 H300 M450 220 H505" class="a"/><text x="90" y="300" class="t">Recognition schedule reduces height with stride (2,1); width remains the CTC axis.</text><text x="90" y="333" class="s">Training-time RepDW branches can be fused into one depthwise convolution at inference.</text><text x="90" y="373" class="s">Paddle source: rec_lcnetv4.py • small channels: 96 → 192 → 384 across later stages.</text>
<!-- RepViT -->
<rect x="770" y="105" width="680" height="320" fill="#edf9f0" stroke="#2f9d58" class="box"/><text x="800" y="145" class="h">RepViT block</text>
<rect x="810" y="185" width="175" height="70" fill="#fff" stroke="#7bb991" class="box"/><text x="897" y="215" text-anchor="middle" class="t">RepDW + SE</text><text x="897" y="239" text-anchor="middle" class="s">token mixer</text>
<rect x="1030" y="185" width="165" height="70" fill="#fff" stroke="#7bb991" class="box"/><text x="1112" y="215" text-anchor="middle" class="t">1×1 expand</text><text x="1112" y="239" text-anchor="middle" class="s">channel mixer</text>
<rect x="1240" y="185" width="165" height="70" fill="#fff" stroke="#7bb991" class="box"/><text x="1322" y="215" text-anchor="middle" class="t">GELU → project</text><text x="1322" y="239" text-anchor="middle" class="s">zero-init BN possible</text>
<path d="M985 220 H1030 M1195 220 H1240" class="a"/><text x="810" y="300" class="t">Fast mobile block; classification stem downsamples both axes.</text><text x="810" y="333" class="s">OCR adaptation must protect H/W and validate fusion output numerically.</text><text x="810" y="373" class="s">Paddle source: rec_repvit.py • stride schedule is the critical transfer choice.</text>
<!-- SVTR and SS2D -->
<rect x="50" y="475" width="680" height="340" fill="#fff4df" stroke="#d98b19" class="box"/><text x="80" y="515" class="h">SVTRv2 recognition flow</text>
<rect x="90" y="555" width="155" height="65" fill="#fff" stroke="#d6a451" class="box"/><text x="167" y="583" text-anchor="middle" class="t">Conv stages</text><text x="167" y="606" text-anchor="middle" class="s">local features</text>
<rect x="280" y="555" width="165" height="65" fill="#fff" stroke="#d6a451" class="box"/><text x="362" y="583" text-anchor="middle" class="t">Transformer</text><text x="362" y="606" text-anchor="middle" class="s">global interactions</text>
<rect x="480" y="555" width="190" height="65" fill="#fff" stroke="#d6a451" class="box"/><text x="575" y="583" text-anchor="middle" class="t">Rearrange → CTC</text><text x="575" y="606" text-anchor="middle" class="s">align features to sequence</text>
<path d="M245 587 H280 M445 587 H480" class="a"/><text x="90" y="670" class="t">Multi-size resizing handles aspect ratio; semantic guidance is a training aid.</text><text x="90" y="703" class="s">Use the complete published recipe for a fair baseline; do not call a stripped model SVTRv2 reproduction.</text><text x="90" y="743" class="s">Paper: arXiv:2411.15858 • ICCV 2025 • implementation also in OpenOCR/PaddleOCR.</text>
<rect x="770" y="475" width="680" height="340" fill="#f3edff" stroke="#8157c8" class="box"/><text x="800" y="515" class="h">VMamba SS2D vs Vim scan</text>
<rect x="810" y="555" width="250" height="65" fill="#fff" stroke="#a68bd8" class="box"/><text x="935" y="583" text-anchor="middle" class="t">VMamba: 2-D map</text><text x="935" y="606" text-anchor="middle" class="s">four scan routes → merge</text>
<rect x="1150" y="555" width="250" height="65" fill="#fff" stroke="#a68bd8" class="box"/><text x="1275" y="583" text-anchor="middle" class="t">Vim: token sequence</text><text x="1275" y="606" text-anchor="middle" class="s">forward + reverse SSM</text>
<text x="810" y="670" class="t">VMamba preserves 2-D traversal; Vim depends on patch/token order.</text><text x="810" y="703" class="s">Both can provide long-range context, but require validated Paddle kernels and OCR stride schedules.</text><text x="810" y="743" class="s">VMamba: arXiv:2401.10166 • Vim: arXiv:2401.09417.</text>
</svg>
