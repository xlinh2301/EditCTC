Global:
  seed: 4096
  model_name: PP-OCRv6_small_rec
  debug: false
  use_gpu: true
  epoch_num: 50
  log_smooth_window: 20
  print_batch_step: 10
  save_model_dir: E:/NCKH/workdir_waterclock/Checkpoint/EditCTC/s4096
  save_epoch_step: 1
  eval_batch_step: [0, 200]
  cal_metric_during_train: true
  calc_epoch_interval: 2
  pretrained_model: /datastore/cndt_thangcpd/linhtruong/workspace5/workdir_text_rec/PPOCRv6/checkpoints/ppocrv6_small_rec_pretrained
  # Additive: partial-load a text-only-pretrained EditRefineDecoder
  # checkpoint on top of the base pretrained_model above (loaded first).
  # See tools/train.py's extra_pretrained/load_pretrained_params hook and
  # tools/pretrain_editrefine.py. This checkpoint was regenerated specifically
  # for PPOCRv6's ppocrv6_dict.txt vocab (v5's ppocrv5_dict.txt differs in
  # ~16k of ~18k lines / token indices, so v5's pretrained decoder cannot be
  # reused directly).
  edit_refine_pretrained: /datastore/cndt_thangcpd/linhtruong/workspace5/workdir_text_rec/PPOCRv6/checkpoints_editrefine_textpretrain/editrefine_pretrained
  checkpoints: E:/NCKH/workdir_waterclock/Checkpoint/EditCTC/s4096/best_accuracy
  save_inference_dir:
  use_visualdl: false
  infer_img: doc/imgs_words/ch/word_1.jpg
  character_dict_path: ppocr/utils/dict/ppocrv6_dict.txt
  max_text_length: &max_text_length 25
  infer_mode: false
  use_space_char: true
  distributed: true
  save_res_path: ./output/rec/predicts_PP-OCRv6_small_rec_s4096_uncertainty_random_50ep.txt
  d2s_train_image_shape: [3, 48, 320]


Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Cosine
    learning_rate: 0.0005
    warmup_epoch: 5
  regularizer:
    name: L2
    factor: 1.0e-04


Architecture:
  model_type: rec
  algorithm: SVTR_LCNet
  Transform:
  Backbone:
    name: PPLCNetV4
    model_size: small
  Head:
    name: MultiHeadEditRefineUncertainty
    use_length_head: true
    length_max: 25
    length_hidden: 128
    # CTC-Seeded Edit Refinement Decoder (reused as-is from the v5 probe).
    edit_hidden: 128
    edit_layers: 3
    edit_nhead: 4
    # Regularization probe (same reg-v1 recipe that worked best for v5):
    # raise decoder/head dropout above the code defaults (dropout=0.1,
    # head_dropout=0.2) to curb the edit branch's tendency to memorize this
    # tiny training set.
    edit_dropout: 0.2
    edit_head_dropout: 0.2
    head_list:
      - CTCHead:
          Neck:
            name: lightsvtr
            dims: 120
            depth: 2
            mlp_ratio: 2.0
            local_kernel: 7
          Head:
            fc_decay: 0.00001
      - NRTRHead:
          nrtr_dim: 384
          max_text_length: *max_text_length

Loss:
  name: MultiLossEditRefineUncertainty
  weight_length: 0.1
  weight_edit: 0.15
  gate_percentile: 0.10
  gate_mode: random
  length_max: 25
  loss_config_list:
    - CTCLoss:
    - NRTRLoss:
    - LengthLoss:

PostProcess:
  name: CTCLabelDecode

Metric:
  name: RecMetric
  main_indicator: acc

Train:
  dataset:
    name: MultiScaleDataSet
    ds_width: false
    data_dir: /datastore/cndt_thangcpd/linhtruong/workspace5/DATA/crop/images/train
    ext_op_transform_idx: 1
    label_file_list:
    - /datastore/cndt_thangcpd/linhtruong/workspace5/DATA/crop/train_label.txt
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - RecConAug:
        prob: 0.5
        ext_data_num: 2
        image_shape: [48, 320, 3]
        max_text_length: *max_text_length
    - RecAug:
    - MultiLabelEncode:
        gtc_encode: NRTRLabelEncode
    - KeepKeys:
        keep_keys:
        - image
        - label_ctc
        - label_gtc
        - length
        - valid_ratio
  sampler:
    name: MultiScaleSampler
    scales: [[320, 32], [320, 48], [320, 64]]
    first_bs: &bs 128
    fix_bs: false
    divided_factor: [8, 16]
    is_training: True
  loader:
    shuffle: true
    batch_size_per_card: *bs
    drop_last: true
    num_workers: 8

Eval:
  dataset:
    name: SimpleDataSet
    data_dir: /datastore/cndt_thangcpd/linhtruong/workspace5/DATA/crop/images/valid
    label_file_list:
    - /datastore/cndt_thangcpd/linhtruong/workspace5/DATA/crop/valid_label.txt
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - MultiLabelEncode:
        gtc_encode: NRTRLabelEncode
    - RecResizeImg:
        image_shape: [3, 48, 320]
    - KeepKeys:
        keep_keys:
        - image
        - label_ctc
        - label_gtc
        - length
        - valid_ratio
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 128
    num_workers: 4
