Global:
  seed: 1024
  model_name: PP-OCRv6_small_rec
  debug: false
  use_gpu: true
  epoch_num: 20
  log_smooth_window: 20
  print_batch_step: 10
  save_model_dir: /datastore/cndt_thangcpd/linhtruong/workspace5/Data/EditCTC_arbor_runs/curated_runs/e44_highres_med512nr_exp12_length_embedding_injection
  save_epoch_step: 1
  eval_batch_step: [0, 200]
  cal_metric_during_train: true
  calc_epoch_interval: 1
  pretrained_model: /datastore/cndt_thangcpd/linhtruong/workspace5/Data/EditCTC_arbor_runs/curated_runs/v3_med512nr/best_accuracy
  freeze_ctc_backbone: false
  character_dict_path: ppocr/utils/dict/ppocrv6_dict.txt
  max_text_length: &max_text_length 25
  infer_mode: false
  use_space_char: true
  distributed: false
  d2s_train_image_shape: [3, 48, 320]

Optimizer:
  name: AdamW
  beta1: 0.9
  beta2: 0.999
  weight_decay: 0.02
  lr:
    name: Cosine
    learning_rate: 0.0001
    warmup_epoch: 2

Architecture:
  model_type: rec
  algorithm: SVTR_LCNet
  Backbone:
    name: PPLCNetV4
    model_size: medium
  Head:
    name: MultiHeadEditRefineNRTR
    edit_mode: token_refine
    act_type: StarReLU
    use_highres_visual: true
    visual_in_channels: 768
    visual_pos_max_height: 4
    visual_pos_max_width: 96
    visual_encoder_layers: 2
    visual_encoder_heads: 16
    visual_encoder_dropout: 0.25
    seed_token_dropout: 0.35
    train_seed_corrupt_prob: 0.35
    train_seed_corrupt_mode: boundary_biased
    use_append_head: true
    append_gate_threshold: 0.50
    append_delta_threshold: 0.05
    use_length_embedding: true
    use_length_head: true
    length_max: 25
    length_hidden: 128
    nrtr_dim: 512
    nrtr_layers: 4
    edit_dropout: 0.30
    edit_head_dropout: 0.30
    head_list:
      - CTCHead:
          Neck:
            name: lightsvtr
            dims: 192
            depth: 2
            mlp_ratio: 4.0
            local_kernel: 7
          Head:
            fc_decay: 0.00001
      - NRTRHead:
          nrtr_dim: 512
          num_decoder_layers: 4
          max_text_length: *max_text_length

Loss:
  name: MultiLossEditRefineToken
  weight_length: 0.1
  weight_edit: 1.0
  weight_append: 0.5
  label_smoothing: 0.10
  gate_pos_weight: 4.0
  gate_percentile: 0.10
  gate_mode: random
  length_max: 25
  loss_config_list:
    - CTCLoss:
    - LengthLoss:

PostProcess:
  name: CTCLabelDecode

Metric:
  name: RecMetric
  main_indicator: acc

Train:
  dataset:
    name: MultiScaleDataSet
    ds_width: false
    data_dir: /datastore/cndt_thangcpd/linhtruong/workspace5/Data/Indomain_curated/crops/train
    ext_op_transform_idx: 1
    label_file_list:
      - /datastore/cndt_thangcpd/linhtruong/workspace5/Data/Indomain_curated/crops/train_label.txt
    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: false
      - RecAug:
          tia_prob: 0.35
          crop_prob: 0.30
          reverse_prob: 0.0
          noise_prob: 0.40
          jitter_prob: 0.35
          blur_prob: 0.30
          hsv_aug_prob: 0.30
      - MultiLabelEncode:
          gtc_encode: NRTRLabelEncode
      - KeepKeys:
          keep_keys:
            - image
            - label_ctc
            - label_gtc
            - length
            - valid_ratio
  sampler:
    name: MultiScaleSampler
    scales: [[320, 32], [320, 48], [320, 64]]
    first_bs: &bs 64
    fix_bs: true
    divided_factor: [8, 16]
    is_training: true
  loader:
    shuffle: true
    batch_size_per_card: *bs
    drop_last: true
    num_workers: 8

Eval:
  dataset:
    name: SimpleDataSet
    data_dir: /datastore/cndt_thangcpd/linhtruong/workspace5/Data/Indomain_curated/crops/valid
    label_file_list:
      - /datastore/cndt_thangcpd/linhtruong/workspace5/Data/Indomain_curated/crops/valid_label.txt
    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: false
      - MultiLabelEncode:
          gtc_encode: NRTRLabelEncode
      - RecResizeImg:
          image_shape: [3, 48, 320]
      - KeepKeys:
          keep_keys:
            - image
            - label_ctc
            - label_gtc
            - length
            - valid_ratio
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 128
    num_workers: 4
