task: >
  Run the E41-E44 architecture-improvement loop for EditCTC. E41 tests an
  NRTR-pretrained decoder integrated into EditCTC using feature-map memory,
  original-image tokens, and a CTC seed, with no standalone NRTR loss branch.
  E42 instruments CTC frame Top-K identities and collapsed spans for leakage-safe
  candidate oracle audits. E43 builds a larger Indomain-only natural bridge bank
  and evaluates substitution-only transfer. E44 trains an independent visual
  candidate/sequence verifier only if candidate coverage is adequate. Keep
  Cross evaluation-only, reserve B_test, preserve gate metrics and provenance,
  and stop after 2-3 controlled variants per family; never tune the harness to
  improve a score.

coordinator:
  cwd: .
  max_cycles: 20
  max_tree_depth: 2
  executor_max_turns: 80
  max_turns: 500
  auto_git: true
  base_branch: main
  trunk_branch: arbor/trunk/editctc-nerd-lcb
  require_base_branch: true
  merge_threshold: 0.0
  enforce_protected: true
  contamination_probe: true
  protected_paths:
    - /datastore/cndt_thangcpd/linhtruong/workspace5/Data/Cross-data
    - /datastore/cndt_thangcpd/linhtruong/workspace5/Data/Indomain/crops/test
    - /datastore/cndt_thangcpd/linhtruong/workspace5/release_EditCTC/checkpoints/s1024
  ui:
    interaction_mode: review
    allow_agent_questions: false
    webui_port: null
  budget_policy:
    max_parallel_executors: 3
  search:
    builtin_backend: alphaxiv
    grounded_ideation: false
  convergence:
    enabled: true
    min_experiments: 4
