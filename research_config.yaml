task: >
  Improve EditCTC's natural-seed error correction through a gated E35-E39
  experimental loop. First build and select a leakage-free Natural CTC Error
  Bank (historical replay versus OOF), then train a KEEP-versus-REPLACE visual
  scorer on actual encoder spans and evaluate selective correction at fixed
  harm rates. If scorer discrimination fails, pivot through candidate-aware
  contrastive fine-tuning and local visual refinement before opening
  DELETE/INSERT, LCB, or multi-step refinement. Execute each experiment in an
  isolated Arbor worktree/branch, use B_dev for iteration, reserve B_test for
  final verification, and preserve all gate metrics and provenance. Stop after
  2-3 controlled variants per hypothesis family; do not modify data or the eval
  harness to improve a score.

coordinator:
  cwd: .
  max_cycles: 20
  max_tree_depth: 2
  executor_max_turns: 80
  max_turns: 500
  auto_git: true
  base_branch: main
  trunk_branch: arbor/trunk/editctc-nerd-lcb
  require_base_branch: true
  merge_threshold: 0.0
  enforce_protected: true
  contamination_probe: true
  protected_paths:
    - /datastore/cndt_thangcpd/linhtruong/workspace5/Data/Cross-data
    - /datastore/cndt_thangcpd/linhtruong/workspace5/Data/Indomain/crops/test
    - /datastore/cndt_thangcpd/linhtruong/workspace5/release_EditCTC/checkpoints/s1024
  ui:
    interaction_mode: review
    allow_agent_questions: false
    webui_port: null
  budget_policy:
    max_parallel_executors: 3
  search:
    builtin_backend: alphaxiv
    grounded_ideation: false
  convergence:
    enabled: true
    min_experiments: 4
